name: Build APK

# 推送到 fongmi 分支或手动触发时构建并签名 APK
on:
  push:
    branches: [fongmi]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 Python 3.10（Chaquopy 构建依赖）
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 生成 local.properties（签名信息）
        run: |
          echo "storeFile=../signing/release.jks" > local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "keyPassword=${{ secrets.STORE_PASSWORD }}" >> local.properties

      - name: 解码签名密钥
        run: |
          mkdir -p signing
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > signing/release.jks

      - name: 构建 release APK
        run: ./gradlew assembleLeanbackRelease assembleMobileRelease --stacktrace

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: Release/apk/*.apk
          if-no-files-found: error

      - name: 上传到 Release
        if: github.ref == 'refs/heads/fongmi'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: Release/apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
