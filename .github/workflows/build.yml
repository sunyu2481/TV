name: Build APK

# 推送到 fongmi 分支或手动触发时构建并签名 APK
on:
  push:
    branches: [fongmi]
  workflow_dispatch:

permissions:
  contents: write

env:
  # FongMi 定制版 media3（含 mpvplayer / ui_danmaku 模块），TV 代码依赖它
  # 用自己 fork 的副本，锁定版本保证构建可复现；需同步上游时用 GitHub 的 Sync fork
  MEDIA_REPO: https://github.com/sunyu2481/media.git
  MEDIA_BRANCH: release-1.11.0-fongmi

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 安装 Python 3.10（Chaquopy 构建依赖）
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 生成 local.properties（签名信息）
        run: |
          echo "storeFile=../signing/release.jks" > local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "keyPassword=${{ secrets.STORE_PASSWORD }}" >> local.properties

      - name: 解码签名密钥
        run: |
          mkdir -p signing
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > signing/release.jks

      - name: 构建 FongMi 定制版 media3（lib-* AAR）
        run: |
          git clone --depth 1 --branch "$MEDIA_BRANCH" "$MEDIA_REPO" ../media
          cd ../media
          # 复刻 FongMi 本地的 assembleLibs：构建所有 lib- 模块
          ./gradlew :lib-common:assembleRelease \
                    :lib-container:assembleRelease \
                    :lib-database:assembleRelease \
                    :lib-datasource:assembleRelease \
                    :lib-datasource-okhttp:assembleRelease \
                    :lib-datasource-rtmp:assembleRelease \
                    :lib-decoder:assembleRelease \
                    :lib-decoder-ffmpeg:assembleRelease \
                    :lib-decoder-mpegh:assembleRelease \
                    :lib-effect:assembleRelease \
                    :lib-exoplayer:assembleRelease \
                    :lib-exoplayer-dash:assembleRelease \
                    :lib-exoplayer-hls:assembleRelease \
                    :lib-exoplayer-rtsp:assembleRelease \
                    :lib-exoplayer-smoothstreaming:assembleRelease \
                    :lib-extractor:assembleRelease \
                    :lib-mpvplayer:assembleRelease \
                    :lib-session:assembleRelease \
                    :lib-ui:assembleRelease \
                    :lib-ui-danmaku:assembleRelease
          # 把 AAR 复制到 TV 项目的 app/libs/
          find libraries -name "lib-*-release.aar" -exec cp {} "$GITHUB_WORKSPACE/app/libs/" \;

      - name: 构建 release APK
        run: ./gradlew assembleLeanbackRelease assembleMobileRelease --stacktrace

      - name: 收集产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: Release/apk/*.apk
          if-no-files-found: error

      - name: 上传到 Release
        if: github.ref == 'refs/heads/fongmi'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: Release/apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}